name: Generic SpiderMonkey Fuzzing Shell Build
on:
  push:
    branches: [firefox-wasm-hunt-bootstrap]
    paths:
      - '.github/workflows/firefox-js-fuzzing-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf2.13 build-essential clang lld llvm ccache python3-dev python3-pip nasm yasm zip unzip pkg-config libz-dev libffi-dev libreadline-dev
      - name: Clone pinned Firefox source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none https://github.com/mozilla-firefox/firefox.git firefox
          cd firefox
          git fetch --depth 1 origin ffc07a625994a9db71c7b6fbfe4be2ed64ed1aee
          git checkout --detach ffc07a625994a9db71c7b6fbfe4be2ed64ed1aee
          git rev-parse HEAD | tee ../source-revision.txt
      - name: Configure fuzzing JS shell
        shell: bash
        run: |
          cat > mozconfig-js-fuzzing <<'EOF'
          ac_add_options --enable-project=js
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --enable-fuzzing
          ac_add_options --disable-jemalloc
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-js-fuzzing
          mk_add_options MOZ_MAKE_FLAGS=-j2
          EOF
          sed -i 's/^          //' mozconfig-js-fuzzing
      - name: Build fuzzing JS shell
        shell: bash
        env:
          MOZCONFIG: ../mozconfig-js-fuzzing
          CC: clang
          CXX: clang++
        run: |
          set -euxo pipefail
          cd firefox
          ./mach build
      - name: Verify wasm-smith interface and package
        shell: bash
        run: |
          set -euxo pipefail
          cd firefox/obj-js-fuzzing/dist/bin
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./js -e 'print(typeof getWasmSmithModule); print(JSON.stringify(getBuildConfiguration()))' > ../../../../fuzzing-build-config.txt
          grep -q '^function$' ../../../../fuzzing-build-config.txt
          cd ../../../..
          tar -cJf spidermonkey-js-fuzzing.tar.xz source-revision.txt fuzzing-build-config.txt firefox/obj-js-fuzzing/dist/bin
          sha256sum spidermonkey-js-fuzzing.tar.xz > spidermonkey-js-fuzzing.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: spidermonkey-js-fuzzing
          path: |
            spidermonkey-js-fuzzing.tar.xz
            spidermonkey-js-fuzzing.tar.xz.sha256
            source-revision.txt
            fuzzing-build-config.txt
          retention-days: 7
