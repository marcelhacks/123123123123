name: Generic SpiderMonkey ASan Debug Build
on:
  push:
    branches: [firefox-wasm-hunt-bootstrap]
    paths:
      - '.github/workflows/firefox-js-asan-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf2.13 build-essential clang lld llvm ccache \
            python3-dev python3-pip nasm yasm zip unzip pkg-config \
            libz-dev libffi-dev libreadline-dev
          rustc --version
          cargo --version
      - name: Clone pinned Firefox source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none https://github.com/mozilla-firefox/firefox.git firefox
          cd firefox
          git fetch --depth 1 origin ffc07a625994a9db71c7b6fbfe4be2ed64ed1aee
          git checkout --detach ffc07a625994a9db71c7b6fbfe4be2ed64ed1aee
          git rev-parse HEAD | tee ../source-revision.txt
      - name: Configure ASan debug JS shell
        shell: bash
        run: |
          set -euxo pipefail
          cat > mozconfig-js-asan <<'EOF'
          ac_add_options --enable-project=js
          ac_add_options --enable-debug
          ac_add_options --enable-optimize
          ac_add_options --enable-address-sanitizer
          ac_add_options --disable-jemalloc
          ac_add_options --enable-gczeal
          ac_add_options --disable-crashreporter
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-js-asan
          mk_add_options MOZ_MAKE_FLAGS=-j2
          EOF
          sed -i 's/^          //' mozconfig-js-asan
          cat mozconfig-js-asan
      - name: Build ASan debug JS shell
        shell: bash
        env:
          MOZCONFIG: ../mozconfig-js-asan
          CC: clang
          CXX: clang++
          RUST_BACKTRACE: '1'
        run: |
          set -euxo pipefail
          cd firefox
          ./mach build
      - name: Smoke test and package
        shell: bash
        run: |
          set -euxo pipefail
          cd firefox/obj-js-asan/dist/bin
          export LD_LIBRARY_PATH="$PWD${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ASAN_OPTIONS=detect_leaks=0 ./js -e 'print(JSON.stringify(getBuildConfiguration())); print(wasmCompileMode())' > ../../../../asan-build-config.txt 2>&1
          cd ../../../..
          tar -cJf spidermonkey-js-asan-debug.tar.xz \
            source-revision.txt asan-build-config.txt \
            firefox/obj-js-asan/dist/bin
          sha256sum spidermonkey-js-asan-debug.tar.xz > spidermonkey-js-asan-debug.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: spidermonkey-js-asan-debug
          path: |
            spidermonkey-js-asan-debug.tar.xz
            spidermonkey-js-asan-debug.tar.xz.sha256
            source-revision.txt
            asan-build-config.txt
          retention-days: 7
